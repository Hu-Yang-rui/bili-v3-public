org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# 🔴 AGP 9 的「内置 Kotlin」与 KSP 不兼容。
#
# 报错原文：
#   "KSP is not compatible with Android Gradle Plugin's built-in Kotlin.
#    Please disable by adding android.builtInKotlin=false to gradle.properties
#    and apply kotlin("android") plugin"
#
# 本项目用 KSP 跑 Moshi 代码生成（`ksp(libs.moshi.kotlin.codegen)`），
# 所以必须**关掉内置 Kotlin**、继续用独立的 `kotlin.android` 插件。
#
# ⚠️ 这与「AGP 9 不再需要 kotlin.android 插件」**并不矛盾**：
#    - 不用 KSP 的项目 → 删掉插件，用 AGP 内置 Kotlin
#    - 用 KSP 的项目（本项目）→ 关内置，保留插件
android.builtInKotlin=false

# 🔴 AGP 9 的**新 DSL**（`android.newDsl=true`，9.0 起默认开）
# 与独立的 `kotlin.android` 插件不兼容。报错原文：
#   "The 'org.jetbrains.kotlin.android' plugin is not compatible with
#    AGP's 9.0 new DSL (android.newDsl=true is enabled by default)."
#
# 官方给的两条路：
#   a) `android.builtInKotlin=true` + 迁移到内置 Kotlin
#      → **本项目走不通**：内置 Kotlin 与 KSP 不兼容（见上一条）
#   b) `android.newDsl=false` 临时绕过
#      → 本项目选这条：KSP 是硬需求（Moshi 代码生成），只能让 DSL 让路
#
# ⚠️ 这是**过渡态**：等 KSP 支持内置 Kotlin 后，应改回 a) 并删掉这两行。
android.newDsl=false

kotlin.code.style=official
ksp.incremental=true

# 国内直连 google()/mavenCentral() 会超时，走阿里云镜像（在 settings.gradle.kts 里配置）
