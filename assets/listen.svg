<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="ttl dsc">
<title id="ttl">BiliV3 listen mode</title>
<desc id="dsc">Listen mode turns VIDEO into AUDIO by leaving the video track unassembled, which means no video decoder is created at all. Video track off, audio track active, background and media session on.</desc>
<defs></defs>
<rect width="1600" height="560" fill="#0E1116"/>
<text x="80" y="92" fill="#FF8FB0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">03</text>
<rect x="124" y="84" width="40" height="1" fill="#66707F"/>
<text x="180" y="92" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="2">LISTEN MODE</text>
<text x="80" y="258" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="64" font-weight="600" text-anchor="start" letter-spacing="-1">VIDEO</text>
<path d="M86 292 V352" fill="none" stroke="#ffffff14" stroke-width="1.5"/>
<polygon points="81,348 91,348 86,358" fill="#66707F"/>
<text x="80" y="440" fill="#FF8FB0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="64" font-weight="600" text-anchor="start" letter-spacing="-1">AUDIO</text>
<text x="760" y="196" fill="#A0A9B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="0">VIDEO TRACK</text>
<text x="1520" y="196" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="30" font-weight="500" text-anchor="end" letter-spacing="0">OFF</text>
<rect x="760" y="222" width="760" height="1" fill="#ffffff14"/>
<text x="760" y="280" fill="#A0A9B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="0">AUDIO TRACK</text>
<text x="1520" y="280" fill="#FF8FB0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="30" font-weight="500" text-anchor="end" letter-spacing="0">ACTIVE</text>
<rect x="760" y="306" width="760" height="1" fill="#ffffff14"/>
<text x="760" y="364" fill="#A0A9B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="0">BACKGROUND</text>
<text x="1520" y="364" fill="#4FD1C5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="30" font-weight="500" text-anchor="end" letter-spacing="0">ON</text>
<rect x="760" y="390" width="760" height="1" fill="#ffffff14"/>
<text x="760" y="448" fill="#A0A9B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="400" text-anchor="start" letter-spacing="0">MEDIA SESSION</text>
<text x="1520" y="448" fill="#4FD1C5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="30" font-weight="500" text-anchor="end" letter-spacing="0">ON</text>
<rect x="760" y="474" width="760" height="1" fill="#ffffff14"/>
<rect x="80" y="496" width="1440" height="1" fill="#ffffff14"/>
<text x="80" y="532" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">The video track is not assembled, so no video decoder is created.</text>
</svg>
