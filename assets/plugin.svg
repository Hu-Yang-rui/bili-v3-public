<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-labelledby="ttl dsc">
<title id="ttl">BiliV3 plugin system</title>
<desc id="dsc">Four plugin types — built-in, JSON rule, native and external package — connect through a single PluginContext that gates every capability. Permissions are checked per call, rules run sandboxed, packages are previewed without unpacking, and failures auto-disable the plugin.</desc>
<defs></defs>
<rect width="1600" height="620" fill="#0E1116"/>
<text x="80" y="92" fill="#FF8FB0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">09</text>
<rect x="124" y="84" width="40" height="1" fill="#66707F"/>
<text x="180" y="92" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="2">PLUGIN SYSTEM</text>
<text x="80" y="200" fill="#E8ECF2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">BUILT-IN</text>
<text x="80" y="228" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">compiled in</text>
<path d="M380 192 H560 C620 192 630 310 690 310" fill="none" stroke="#ffffff14" stroke-width="1.5"/>
<text x="80" y="284" fill="#E8ECF2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">JSON RULE</text>
<text x="80" y="312" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">sandboxed interpreter</text>
<path d="M380 276 H560 C620 276 630 310 690 310" fill="none" stroke="#ffffff14" stroke-width="1.5"/>
<text x="80" y="368" fill="#E8ECF2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">NATIVE</text>
<text x="80" y="396" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">Kotlin API</text>
<path d="M380 360 H560 C620 360 630 310 690 310" fill="none" stroke="#ffffff14" stroke-width="1.5"/>
<text x="80" y="452" fill="#E8ECF2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">EXTERNAL</text>
<text x="80" y="480" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">.bvplugin preview</text>
<path d="M380 444 H560 C620 444 630 310 690 310" fill="none" stroke="#ffffff14" stroke-width="1.5"/>
<rect x="720" y="248" width="3" height="124" fill="#FF8FB0"/>
<text x="748" y="306" fill="#E8ECF2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="600" text-anchor="start" letter-spacing="0">PluginContext</text>
<text x="748" y="344" fill="#A0A9B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">single capability gate</text>
<text x="1040" y="200" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">PERMISSION</text>
<text x="1040" y="228" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">checked per call</text>
<rect x="1040" y="246" width="480" height="1" fill="#ffffff14"/>
<text x="1040" y="284" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">SANDBOX</text>
<text x="1040" y="312" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">no arbitrary code</text>
<rect x="1040" y="330" width="480" height="1" fill="#ffffff14"/>
<text x="1040" y="368" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">PREVIEW</text>
<text x="1040" y="396" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">no unpack to disk</text>
<rect x="1040" y="414" width="480" height="1" fill="#ffffff14"/>
<text x="1040" y="452" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">ISOLATION</text>
<text x="1040" y="480" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">failures auto-disable</text>
<rect x="1040" y="498" width="480" height="1" fill="#ffffff14"/>
<rect x="80" y="556" width="1440" height="1" fill="#ffffff14"/>
<text x="80" y="592" fill="#4FD1C5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">Cookie never enters a plugin.</text>
</svg>
