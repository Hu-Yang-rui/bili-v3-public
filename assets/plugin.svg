<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="插件系统：内置、JSON 规则、原生、外部包四种类型，权限经 PluginContext 收敛">
<title>插件系统：内置、JSON 规则、原生、外部包四种类型，权限经 PluginContext 收敛</title>
<defs>
<linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#0E1116" stop-opacity="0"/><stop offset="1" stop-color="#0E1116" stop-opacity="1"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#FF8FB0" stop-opacity="0.10"/><stop offset="1" stop-color="#FF8FB0" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1200" height="470" fill="#0E1116"/>
<text x="72" y="62" fill="#FF8FB0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="500" text-anchor="start" letter-spacing="0">10</text>
<rect x="98" y="53" width="22" height="1" fill="#66707F"/>
<text x="130" y="62" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="500" text-anchor="start" letter-spacing="1.5">PLUGIN SYSTEM</text>
<rect x="72" y="96" width="620" height="60" fill="#171B22" stroke="#ffffff14"/>
<text x="96" y="122" fill="#E8ECF2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0">BUILTIN</text>
<text x="96" y="142" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">compiled in</text>
<text x="668" y="132" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="end" letter-spacing="0">无额外权限</text>
<rect x="72" y="172" width="620" height="60" fill="#1F2530" stroke="#FF8FB0" stroke-opacity='0.45'/>
<text x="96" y="198" fill="#FF8FB0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0">JSON RULE</text>
<text x="96" y="218" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">sandboxed interpreter</text>
<text x="668" y="208" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="end" letter-spacing="0">固定枚举 · 不执行代码</text>
<circle cx="86" cy="202" r="3" fill="#FF8FB0"><animate attributeName="opacity" values="1;0.35;1" dur="2.0s" repeatCount="indefinite"/></circle>
<rect x="72" y="248" width="620" height="60" fill="#171B22" stroke="#ffffff14"/>
<text x="96" y="274" fill="#E8ECF2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0">NATIVE</text>
<text x="96" y="294" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">Kotlin API</text>
<text x="668" y="284" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="end" letter-spacing="0">经 PluginContext 收敛</text>
<rect x="72" y="324" width="620" height="60" fill="#171B22" stroke="#ffffff14"/>
<text x="96" y="350" fill="#E8ECF2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0">EXTERNAL PACKAGE</text>
<text x="96" y="370" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">preview only</text>
<text x="668" y="360" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="end" letter-spacing="0">解析预览 · 不解压落盘</text>
<rect x="728" y="96" width="400" height="284" fill="#171B22" stroke="#ffffff14"/>
<text x="752" y="128" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="500" text-anchor="start" letter-spacing="1.5">PERMISSION MODEL</text>
<rect x="752" y="142" width="352" height="1" fill="#ffffff14"/>
<text x="752" y="172" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">PLAYER_READ</text>
<text x="1104" y="172" fill="#FF8FB0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="500" text-anchor="end" letter-spacing="0">HIGH</text>
<text x="752" y="204" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">QUEUE_WRITE</text>
<text x="1104" y="204" fill="#FFC44D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="500" text-anchor="end" letter-spacing="0">MEDIUM</text>
<text x="752" y="236" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">FAVORITES_WRITE</text>
<text x="1104" y="236" fill="#FF8FB0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="500" text-anchor="end" letter-spacing="0">HIGH</text>
<text x="752" y="268" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">NETWORK</text>
<text x="1104" y="268" fill="#FF8FB0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="500" text-anchor="end" letter-spacing="0">HIGH</text>
<text x="752" y="300" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">LYRICS_READ</text>
<text x="1104" y="300" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="500" text-anchor="end" letter-spacing="0">LOW</text>
<rect x="752" y="336" width="352" height="1" fill="#ffffff14"/>
<text x="752" y="362" fill="#4FD1C5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0">Cookie 永不进入插件</text>
<rect x="72" y="410" width="1056" height="1" fill="#ffffff14"/>
<text x="72" y="438" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">Plugin exceptions are isolated. Three consecutive failures auto-disable the plugin.</text>
</svg>
