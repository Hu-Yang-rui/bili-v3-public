<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
<title id="t">Lyrics — words moving with time</title>
<desc id="d">Five lines of text drift slowly upward, the centre line brightest and breathing gently with a pink hairline beneath it. Type itself is the visual element.</desc>
<rect width="1600" height="700" fill="#0E1116"/>
<text x="800.0" y="240.3" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="400" text-anchor="middle" opacity="0.192">the water asks no question</text>
<text x="800.0" y="332.3" fill="#A0A9B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="400" text-anchor="middle" opacity="0.451">nor the hour an answer</text>
<text x="800.0" y="424.3" fill="#E8ECF2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="62" font-weight="400" text-anchor="middle" opacity="0.934">THIS LINE IS NOW</text>
<text x="800.0" y="516.3" fill="#A0A9B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="400" text-anchor="middle" opacity="0.451">and the next one waits</text>
<text x="800.0" y="608.3" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="400" text-anchor="middle" opacity="0.192">quietly, below</text>
<rect x="610.0" y="456.3" width="380.0" height="2.0" fill="#FF8FB0" opacity="0.850"/>
<rect x="1400.0" y="250.0" width="12.0" height="1.0" fill="#3C4450" opacity="0.300"/>
<rect x="1400.0" y="300.0" width="12.0" height="1.0" fill="#3C4450" opacity="0.300"/>
<rect x="1400.0" y="350.0" width="26.0" height="1.0" fill="#FF8FB0" opacity="0.500"/>
<rect x="1400.0" y="400.0" width="26.0" height="1.0" fill="#FF8FB0" opacity="0.500"/>
<rect x="1400.0" y="450.0" width="26.0" height="1.0" fill="#FF8FB0" opacity="0.500"/>
<rect x="1400.0" y="500.0" width="12.0" height="1.0" fill="#3C4450" opacity="0.300"/>
<rect x="1400.0" y="550.0" width="12.0" height="1.0" fill="#3C4450" opacity="0.300"/>
<text x="200.0" y="190.0" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="400" text-anchor="start" opacity="0.850">LYRICS</text>
<text x="1400.0" y="620.0" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="end" opacity="0.500">provider chain</text>
</svg>
