<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img"
     aria-label="BiliV3 动效令牌演示：四条跑道分别演示 220ms 页面转场、160ms 淡入淡出、180ms 图片淡入、1200ms 骨架微光，缓动统一 cubic-bezier(0.16,1,0.3,1)。">
  <title>BiliV3 动效令牌</title>

  <!-- 内联 CSS + prefers-color-scheme：同一份文件适配 GitHub 深浅主题 -->
  <style>
    .bg    { fill:#121114; }
    .lane  { fill:#1C1A1F; }
    .tt    { fill:#F0EDF2; }
    .tm    { fill:#A8A2B0; }
    .tk    { fill:#7A7484; }
    .dot   { fill:#FF8FB0; }
    .grid  { stroke:#FFFFFF; stroke-opacity:.07; }
    @media (prefers-color-scheme: light) {
      .bg   { fill:#F7F4F6; }
      .lane { fill:#FFFFFF; }
      .tt   { fill:#1A171C; }
      .tm   { fill:#6B6470; }
      .tk   { fill:#A79FAD; }
      .dot  { fill:#E8578A; }
      .grid { stroke:#000000; stroke-opacity:.07; }
    }
  </style>

  <rect class="bg" width="1280" height="360"/>

  <!-- 三条竖向网格线：标出 0 / 50% / 100% 行程 -->
  <g class="grid" stroke-width="1">
    <path d="M 300 40 L 300 320"/>
    <path d="M 760 40 L 760 320"/>
    <path d="M 1220 40 L 1220 320"/>
  </g>

  <!-- 四条跑道：一令牌一条，不重叠 -->
  <rect class="lane" x="300" y="44"  width="920" height="34" rx="17"/>
  <rect class="lane" x="300" y="118" width="920" height="34" rx="17"/>
  <rect class="lane" x="300" y="192" width="920" height="34" rx="17"/>
  <rect class="lane" x="300" y="266" width="920" height="34" rx="17"/>

  <!-- 轨道标签 -->
  <g font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif" font-size="15">
    <text class="tt" x="56" y="60">页面转场</text>
    <text class="tk" x="56" y="78" font-size="13">220ms</text>

    <text class="tt" x="56" y="134">淡入淡出</text>
    <text class="tk" x="56" y="152" font-size="13">160ms</text>

    <text class="tt" x="56" y="208">图片淡入</text>
    <text class="tk" x="56" y="226" font-size="13">180ms</text>

    <text class="tt" x="56" y="282">骨架微光</text>
    <text class="tk" x="56" y="300" font-size="13">1200ms</text>
  </g>

  <!-- ══ 三条滑块：缓动统一 cubic-bezier(0.16,1,0.3,1) ══
       SMIL 的 keySplines 正是这条贝塞尔曲线，与 Compose 的 Motion token 同源。
       calcMode="spline" + 3 个 keyTimes 需要 2 组 keySplines。

       ⚠️ 滑块 x 写成静态值 300（= 行程起点），animate 用 attributeName="x"
       从 300 推到 1220-34=1186。这样 SMIL 不执行时滑块停在左端，
       静态帧是「都在起点」这一有意义的画面，而不是堆在画布左上角。 -->
  <g class="dot">
    <rect x="300" y="44" width="34" height="34" rx="17">
      <animate attributeName="x" values="300;1186;300" keyTimes="0;0.5;1"
        calcMode="spline" keySplines="0.16 1 0.3 1;0.16 1 0.3 1"
        dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="118" width="34" height="34" rx="17">
      <animate attributeName="x" values="300;1186;300" keyTimes="0;0.5;1"
        calcMode="spline" keySplines="0.16 1 0.3 1;0.16 1 0.3 1"
        dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="192" width="34" height="34" rx="17">
      <animate attributeName="x" values="300;1186;300" keyTimes="0;0.5;1"
        calcMode="spline" keySplines="0.16 1 0.3 1;0.16 1 0.3 1"
        dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══ 骨架微光：1200ms 相位，用 opacity 呼吸表达而非位移 ══
       静态帧基底 opacity=0.45，落在两个极端之间：
       既不「看不见」，也不「全亮」，脱离动画也读得出是骨架条。 -->
  <rect class="lane" x="300" y="266" width="920" height="34" rx="17" opacity="0.45">
    <animate attributeName="opacity" values="0.25;0.85;0.25" dur="1.2s"
      repeatCount="indefinite"/>
  </rect>

  <text class="tm" x="56" y="344"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">
    缓动统一 cubic-bezier(0.16, 1, 0.3, 1) —— keySplines 与 Compose Motion token 同源
  </text>
  <text class="tk" x="1220" y="344" text-anchor="end"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14">
    横向为行程，三条竖线为 0 / 50% / 100%
  </text>

  <rect x="0.5" y="0.5" width="1279" height="359" fill="none" stroke="#888888" stroke-opacity="0.14"/>
</svg>
