<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-labelledby="ttl dsc">
<title id="ttl">BiliV3 architecture</title>
<desc id="dsc">The main spine runs UI to ViewModel to Repository to BiliApi, with Media3, MediaSession, PlaybackController, PlaybackQueue, PlaybackProgress, lyrics and plugin runtime hanging off it. Deliberate choices: hand-written container, manual tolerant parsing, hand-written protobuf, DataStore and Keystore, 379 unit tests, no cards, dark theme only.</desc>
