<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="ttl dsc">
<title id="ttl">BiliV3 playback memory</title>
<desc id="dsc">Playback memory resumes at 12:34 of 24:51. Progress is keyed by bvid and cid so each part of a multi-part video is independent; a part counts as complete at ninety percent.</desc>
<defs></defs>
<rect width="1600" height="560" fill="#0E1116"/>
<text x="80" y="92" fill="#FF8FB0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">04</text>
<rect x="124" y="84" width="40" height="1" fill="#66707F"/>
<text x="180" y="92" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="2">PLAYBACK MEMORY</text>
<text x="80" y="258" fill="#E8ECF2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="72" font-weight="500" text-anchor="start" letter-spacing="0">12:34</text>
<text x="320" y="258" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="36" font-weight="400" text-anchor="start" letter-spacing="0">/ 24:51</text>
<rect x="80" y="320" width="1440" height="3" fill="#ffffff14"/>
<rect x="80" y="320" width="728.64" height="3" fill="#FF8FB0"/>
<rect x="807.1" y="311" width="3" height="21" fill="#FF8FB0"/>
<text x="80" y="382" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">P1</text>
<rect x="80" y="398" width="150" height="3" fill="#ffffff14"/>
<rect x="80" y="398" width="108.0" height="3" fill="#66707F"/>
<text x="280" y="382" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">P2</text>
<rect x="280" y="398" width="150" height="3" fill="#ffffff14"/>
<rect x="280" y="398" width="27.0" height="3" fill="#66707F"/>
<text x="480" y="382" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">P3</text>
<rect x="480" y="398" width="150" height="3" fill="#ffffff14"/>
<rect x="480" y="398" width="136.5" height="3" fill="#4FD1C5"/>
<text x="680" y="382" fill="#A0A9B8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">P4</text>
<rect x="680" y="398" width="150" height="3" fill="#ffffff14"/>
<rect x="80" y="452" width="1440" height="1" fill="#ffffff14"/>
<text x="80" y="494" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="500" text-anchor="start" letter-spacing="1.5">KEY</text>
<text x="80" y="526" fill="#A0A9B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">bvid · cid</text>
<text x="440" y="494" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="500" text-anchor="start" letter-spacing="1.5">PARTS</text>
<text x="440" y="526" fill="#A0A9B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">independent</text>
<text x="800" y="494" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="500" text-anchor="start" letter-spacing="1.5">RESUME</text>
<text x="800" y="526" fill="#A0A9B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">local + server</text>
<text x="1160" y="494" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="500" text-anchor="start" letter-spacing="1.5">COMPLETE</text>
<text x="1160" y="526" fill="#A0A9B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">&gt;= 90%</text>
</svg>
