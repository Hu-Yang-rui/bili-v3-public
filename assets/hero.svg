<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-labelledby="t d">
<title id="t">BiliV3 hero — an abstract media stream crossing the frame</title>
<desc id="d">A single continuous curve enters from the left and gains structure as it travels: a sparse spectrum becomes a waveform, nodes light up along the way, and a fine time ruler runs beneath. Suggests video, audio, playback, memory and queue without labelling any of them.</desc>
