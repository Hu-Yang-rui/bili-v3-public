<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="ttl dsc">
<title id="ttl">BiliV3 favorites and organize</title>
<desc id="dsc">Organizing a favorites folder: 124 items are filtered by sandboxed rules down to 42 candidates, which a person reviews and decides on. Rules narrow the range; nothing is deleted automatically.</desc>
<defs></defs>
<rect width="1600" height="560" fill="#0E1116"/>
<text x="80" y="92" fill="#FF8FB0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0">05</text>
<rect x="124" y="84" width="40" height="1" fill="#66707F"/>
<text x="180" y="92" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="500" text-anchor="start" letter-spacing="2">FAVORITES / ORGANIZE</text>
<text x="80" y="196" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="500" text-anchor="start" letter-spacing="1.5">FAVORITES</text>
<rect x="80" y="214" width="280" height="1" fill="#ffffff14"/>
<text x="80" y="316" fill="#E8ECF2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="56" font-weight="600" text-anchor="start" letter-spacing="0">124</text>
<text x="80" y="362" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">in folder</text>
<path d="M392 285 L399 292 L392 299" fill="none" stroke="#66707F" stroke-width="1.5"/>
<text x="440" y="196" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="500" text-anchor="start" letter-spacing="1.5">FILTER</text>
<rect x="440" y="214" width="280" height="1" fill="#ffffff14"/>
<text x="440" y="316" fill="#A0A9B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="56" font-weight="600" text-anchor="start" letter-spacing="0">rules</text>
<text x="440" y="362" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">sandboxed</text>
<path d="M752 285 L759 292 L752 299" fill="none" stroke="#66707F" stroke-width="1.5"/>
<text x="800" y="196" fill="#FF8FB0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="500" text-anchor="start" letter-spacing="1.5">CANDIDATES</text>
<rect x="800" y="214" width="280" height="1" fill="#ffffff14"/>
<text x="800" y="316" fill="#FF8FB0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="56" font-weight="600" text-anchor="start" letter-spacing="0">42</text>
<text x="800" y="362" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">matched</text>
<path d="M1112 285 L1119 292 L1112 299" fill="none" stroke="#66707F" stroke-width="1.5"/>
<text x="1160" y="196" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="500" text-anchor="start" letter-spacing="1.5">REVIEW</text>
<rect x="1160" y="214" width="280" height="1" fill="#ffffff14"/>
<text x="1160" y="316" fill="#E8ECF2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="56" font-weight="600" text-anchor="start" letter-spacing="0">you</text>
<text x="1160" y="362" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">decide</text>
<rect x="80" y="452" width="1440" height="1" fill="#ffffff14"/>
<text x="80" y="494" fill="#E8ECF2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">Rules narrow the range.</text>
<text x="80" y="526" fill="#66707F" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">Nothing is deleted without confirmation.</text>
