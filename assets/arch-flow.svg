<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img"
     aria-label="BiliV3 架构数据流：UI → ViewModel → Repository → ApiClient，ApiClient 下挂 Wbi 签名、Endpoints、容错 JSON 解析。">
  <title>BiliV3 架构数据流</title>

  <!-- 主题自适应：内联 CSS + prefers-color-scheme。
       SVG 以 <img> 载入时，这份内联样式仍会生效，媒体查询按宿主页面主题求值，
       因此同一份文件在 GitHub 深浅主题下都成立，不必再维护两份。 -->
  <style>
    .bg      { fill:#121114; }
    .card    { fill:#1C1A1F; stroke:#FFFFFF; stroke-opacity:.10; }
    .tt      { fill:#F0EDF2; }
    .tm      { fill:#A8A2B0; }
    .acc     { fill:#FF8FB0; }
    .accst   { stroke:#FF8FB0; }
    .arrow   { stroke:#FFFFFF; stroke-opacity:.20; fill:none; }
    @media (prefers-color-scheme: light) {
      .bg    { fill:#F7F4F6; }
      .card  { fill:#FFFFFF; stroke:#000000; stroke-opacity:.06; }
      .tt    { fill:#1A171C; }
      .tm    { fill:#6B6470; }
      .acc   { fill:#C2416B; }   /* 文字安全版：原色 #E8578A 做文字不达 AA */
      .accst { stroke:#C2416B; }
      .arrow { stroke:#000000; stroke-opacity:.16; }
    }
  </style>

  <rect class="bg" width="1280" height="420"/>

  <!-- ══ 主干：四层 ══ -->
  <rect class="card" x="60"  y="70" width="210" height="64" rx="16"/>
  <text class="tt" x="165" y="110" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600">UI (Compose)</text>

  <rect class="card" x="330" y="70" width="250" height="64" rx="16"/>
  <text class="tt" x="455" y="110" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600">ViewModel (StateFlow)</text>

  <rect class="card" x="640" y="70" width="190" height="64" rx="16"/>
  <text class="tt" x="735" y="110" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600">Repository</text>

  <rect class="card" x="890" y="70" width="190" height="64" rx="16"/>
  <text class="tt" x="985" y="110" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600">ApiClient</text>

  <!-- 主干连线 -->
  <path class="arrow" d="M 270 102 L 330 102" stroke-width="1.5"/>
  <path class="arrow" d="M 580 102 L 640 102" stroke-width="1.5"/>
  <path class="arrow" d="M 830 102 L 890 102" stroke-width="1.5"/>

  <!-- ══ ApiClient 下挂的三个易变点 ══ -->
  <path class="arrow" d="M 985 134 L 985 362" stroke-width="1.5"/>
  <path class="arrow" d="M 985 226 L 1010 226" stroke-width="1.5"/>
  <path class="arrow" d="M 985 294 L 1010 294" stroke-width="1.5"/>
  <path class="arrow" d="M 985 362 L 1010 362" stroke-width="1.5"/>

  <rect class="card" x="1010" y="200" width="190" height="52" rx="14"/>
  <text class="tt" x="1105" y="232" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16">Wbi（签名）</text>

  <rect class="card" x="1010" y="268" width="190" height="52" rx="14"/>
  <text class="tt" x="1105" y="300" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16">Endpoints</text>

  <rect class="card" x="1010" y="336" width="190" height="52" rx="14"/>
  <text class="tt" x="1105" y="368" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16">容错 JSON 解析</text>

  <!-- ══ 脉冲：一个周期 2.6s，各段用 keyTimes 串成一条波 ══
       首帧 keyTimes 必须以 0 开头，所以用 keyPoints="0;0;1;1" 表达
       「先停在起点、再移动、然后停在终点」，从而让每段依次点亮。

       ⚠️ 每个圆的 cx/cy 落在对应线段的**起点**，animateMotion 的 path
       写成相对位移（M 0 0 L …）。这样即便 SMIL 不执行（Safari 的 <img>、
       camo 代理、打印），圆点也停在箭头起点，像一组连接节点；
       若把 cx/cy 留成 0，静态帧会在画布左上角堆 7 个粉点。 -->
  <g class="acc">
    <circle cx="270" cy="102" r="4">
      <animateMotion dur="2.6s" repeatCount="indefinite" calcMode="linear"
        path="M 0 0 L 60 0" keyPoints="0;0;1;1" keyTimes="0;0.02;0.12;1"/>
    </circle>
    <circle cx="580" cy="102" r="4">
      <animateMotion dur="2.6s" repeatCount="indefinite" calcMode="linear"
        path="M 0 0 L 60 0" keyPoints="0;0;1;1" keyTimes="0;0.12;0.24;1"/>
    </circle>
    <circle cx="830" cy="102" r="4">
      <animateMotion dur="2.6s" repeatCount="indefinite" calcMode="linear"
        path="M 0 0 L 60 0" keyPoints="0;0;1;1" keyTimes="0;0.24;0.36;1"/>
    </circle>
    <circle cx="985" cy="134" r="4">
      <animateMotion dur="2.6s" repeatCount="indefinite" calcMode="linear"
        path="M 0 0 L 0 228" keyPoints="0;0;1;1" keyTimes="0;0.36;0.56;1"/>
    </circle>
    <circle cx="985" cy="226" r="4">
      <animateMotion dur="2.6s" repeatCount="indefinite" calcMode="linear"
        path="M 0 0 L 25 0" keyPoints="0;0;1;1" keyTimes="0;0.56;0.62;1"/>
    </circle>
    <circle cx="985" cy="294" r="4">
      <animateMotion dur="2.6s" repeatCount="indefinite" calcMode="linear"
        path="M 0 0 L 25 0" keyPoints="0;0;1;1" keyTimes="0;0.62;0.68;1"/>
    </circle>
    <circle cx="985" cy="362" r="4">
      <animateMotion dur="2.6s" repeatCount="indefinite" calcMode="linear"
        path="M 0 0 L 25 0" keyPoints="0;0;1;1" keyTimes="0;0.68;0.74;1"/>
    </circle>
  </g>

  <!-- ══ 高亮描边：脉冲到达时对应盒子亮一下 ══
       用叠加 rect 而不是 animate 盒子的 stroke-opacity ——
       内联 CSS 的优先级高于 presentation attribute，
       直接 animate 属性会被 .card 的 stroke-opacity 覆盖掉。

       ⚠️ opacity 的静态基底值必须写在**每个 rect 自己**身上，
       绝不能写在父 <g> 上。父组的 opacity 会与子元素相乘：
       <g opacity="0"><rect><animate values="0;0.85"/></rect></g>
       计算结果是 0 × 0.85 = 0，高亮**永远不会出现**。
       （实测：父组 opacity=0 时子 rect 动画到峰值仍是全透明；
       把基底移到子 rect 上后正常显示。） -->
  <g fill="none" class="accst" stroke-width="1.5">
    <rect x="890" y="70" width="190" height="64" rx="16" opacity="0">
      <animate attributeName="opacity" values="0;0;0.85;0" keyTimes="0;0.30;0.40;0.55"
               dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1010" y="200" width="190" height="52" rx="14" opacity="0">
      <animate attributeName="opacity" values="0;0;0.85;0" keyTimes="0;0.58;0.66;0.80"
               dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1010" y="268" width="190" height="52" rx="14" opacity="0">
      <animate attributeName="opacity" values="0;0;0.85;0" keyTimes="0;0.64;0.72;0.86"
               dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1010" y="336" width="190" height="52" rx="14" opacity="0">
      <animate attributeName="opacity" values="0;0;0.85;0" keyTimes="0;0.70;0.78;0.92"
               dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text class="tm" x="60" y="396"
        font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif" font-size="15">
    把易变的收敛到 3 个文件：Endpoints / Wbi / BiliApi
  </text>

  <rect x="0.5" y="0.5" width="1279" height="419" fill="none" stroke="#888888" stroke-opacity="0.14"/>
</svg>
