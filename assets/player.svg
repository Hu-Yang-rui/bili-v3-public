<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="统一播放核心：DASH 音视频分离经 MergingMediaSource 合轨，由 PlaybackController 单一写入状态">
<title>统一播放核心：DASH 音视频分离经 MergingMediaSource 合轨，由 PlaybackController 单一写入状态</title>
<defs>
