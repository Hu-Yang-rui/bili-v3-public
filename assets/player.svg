<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="ttl dsc">
<title id="ttl">BiliV3 player architecture</title>
<desc id="dsc">Two DASH media streams, video and audio, converge through MergingMediaSource into a single Playback Core on Media3, which emits to MediaSession, queue and playback progress. One writer of state.</desc>
<defs></defs>
