<text x="898" y="336" fill="#E8ECF2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="500" text-anchor="start" letter-spacing="0">PlayerHolder</text>
<text x="898" y="354" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" text-anchor="start" letter-spacing="0">Activity-scoped</text>
<circle cx="1108" cy="339" r="3" fill="#4FD1C5"><animate attributeName="opacity" values="1;0.35;1" dur="3.2s" repeatCount="indefinite"/></circle>
<rect x="72" y="372" width="1056" height="1" fill="#ffffff14"/>
<text x="72" y="400" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" letter-spacing="0">No second player. No second progress store. Every surface reads the same StateFlow.</text>
</svg>
