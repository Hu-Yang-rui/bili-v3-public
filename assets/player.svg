<text x="90" y="232" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" text-anchor="start" letter-spacing="0">AAC / 192kbps</text>
<path d="M292 152 H360 Q376 152 376 168 V196 Q376 212 392 212" fill="none" stroke="#ffffff14"/><path d="M292 216 H360 Q376 216 376 208 V196 Q376 212 392 212" fill="none" stroke="#ffffff14"/>
<rect x="392" y="182" width="150" height="60" fill="#1F2530" stroke="#ffffff14"/>
<text x="467" y="206" fill="#E8ECF2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0">MergingMediaSource</text>
<text x="467" y="224" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" text-anchor="middle" letter-spacing="0">Media3 1.4.1</text>
<path d="M542 212 H600" stroke="#ffffff14"/>
<rect x="600" y="150" width="228" height="124" fill="#171B22" stroke="#FF8FB0" stroke-opacity="0.4"/>
<text x="618" y="178" fill="#E8ECF2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0">PlaybackController</text>
