<text x="80" y="380" fill="#E8ECF2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="500" text-anchor="start" letter-spacing="0">AUDIO STREAM</text>
<text x="80" y="408" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">DASH · AAC · 192K</text>
<path d="M80 442 H520 C596 442 604 390 664 390" fill="none" stroke="#ffffff14" stroke-width="1.5"/>
<rect x="700" y="248" width="3" height="194" fill="#FF8FB0"/>
<text x="728" y="336" fill="#E8ECF2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="600" text-anchor="start" letter-spacing="0">PLAYBACK CORE</text>
<text x="728" y="378" fill="#66707F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">MERGING MEDIA SOURCE · MEDIA3</text>
<text x="728" y="412" fill="#A0A9B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" letter-spacing="0">single writer of state</text>
