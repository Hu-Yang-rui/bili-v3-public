<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img"
     aria-label="BiliV3 配色令牌：深色与浅色两套，各六个角色 —— 页面底、卡片、悬浮、主文字、次文字、品牌粉。品牌色做文字不达 WCAG AA，故派生文字安全版。">
  <title>BiliV3 配色令牌</title>

  <style>
    .bg   { fill:#121114; }
    .tt   { fill:#F0EDF2; }
    .tm   { fill:#A8A2B0; }
    .tk   { fill:#7A7484; }
    .rule { stroke:#FFFFFF; stroke-opacity:.10; }
    @media (prefers-color-scheme: light) {
      .bg   { fill:#F7F4F6; }
      .tt   { fill:#1A171C; }
      .tm   { fill:#6B6470; }
      .tk   { fill:#A79FAD; }
      .rule { stroke:#000000; stroke-opacity:.10; }
    }
  </style>

  <defs>
    <!-- 共享相位微光：与骨架微光同一令牌 -->
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="176" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="x1" values="56;1224" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="176;1344" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1280" height="400"/>

  <!-- ══ 行标题 ══ -->
  <text class="tt" x="56" y="44"
        font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="16" font-weight="600">深色（主态）</text>
  <text class="tm" x="180" y="44"
        font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="13">页面底刻意不用纯黑（OLED 拖影）</text>

  <!-- ══ 深色行：6 列，每列「角色名 / 色块 / hex」 ══ -->
  <g font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
    <text class="tm" x="56"   y="76">页面底</text>
    <text class="tm" x="256"  y="76">卡片</text>
    <text class="tm" x="456"  y="76">悬浮</text>
    <text class="tm" x="656"  y="76">主文字</text>
    <text class="tm" x="856"  y="76">次文字</text>
    <text class="tm" x="1056" y="76">品牌粉</text>
  </g>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
    <rect x="56"   y="86" width="180" height="46" rx="10" fill="#121114" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="72" y="115" fill="#F0EDF2">#121114</text>

    <rect x="256"  y="86" width="180" height="46" rx="10" fill="#1C1A1F" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="272" y="115" fill="#F0EDF2">#1C1A1F</text>

    <rect x="456"  y="86" width="180" height="46" rx="10" fill="#26232B" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="472" y="115" fill="#F0EDF2">#26232B</text>

    <rect x="656"  y="86" width="180" height="46" rx="10" fill="#F0EDF2"/>
    <text x="672" y="115" fill="#1A171C">#F0EDF2</text>

    <rect x="856"  y="86" width="180" height="46" rx="10" fill="#A8A2B0"/>
    <text x="872" y="115" fill="#1A171C">#A8A2B0</text>

    <rect x="1056" y="86" width="180" height="46" rx="10" fill="#FF8FB0"/>
    <text x="1072" y="115" fill="#1A171C" font-weight="600">#FF8FB0</text>
  </g>

  <!-- 微光扫过（基底 opacity 0，SMIL 不执行时完全不出现） -->
  <g opacity="0">
    <rect x="56" y="86" width="1180" height="46" rx="10" fill="url(#sheen)"/>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.08;1" dur="3.6s" repeatCount="indefinite"/>
  </g>

  <path class="rule" d="M 56 152 L 1236 152" stroke-width="1"/>

  <!-- ══ 浅色行 ══ -->
  <text class="tt" x="56" y="186"
        font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="16" font-weight="600">浅色（跟随系统）</text>
  <text class="tm" x="230" y="186"
        font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="13">品牌粉压深一档 —— 提亮版在白底上不达 AA</text>

  <g font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
    <text class="tm" x="56"   y="218">页面底</text>
    <text class="tm" x="256"  y="218">卡片</text>
    <text class="tm" x="456"  y="218">悬浮</text>
    <text class="tm" x="656"  y="218">主文字</text>
    <text class="tm" x="856"  y="218">次文字</text>
    <text class="tm" x="1056" y="218">品牌粉</text>
  </g>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
    <rect x="56"   y="228" width="180" height="46" rx="10" fill="#F7F4F6" stroke="#000000" stroke-opacity="0.14"/>
    <text x="72" y="257" fill="#1A171C">#F7F4F6</text>

    <rect x="256"  y="228" width="180" height="46" rx="10" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.14"/>
    <text x="272" y="257" fill="#1A171C">#FFFFFF</text>

    <rect x="456"  y="228" width="180" height="46" rx="10" fill="#F2EDF0" stroke="#000000" stroke-opacity="0.14"/>
    <text x="472" y="257" fill="#1A171C">#F2EDF0</text>

    <rect x="656"  y="228" width="180" height="46" rx="10" fill="#1A171C"/>
    <text x="672" y="257" fill="#F0EDF2">#1A171C</text>

    <rect x="856"  y="228" width="180" height="46" rx="10" fill="#6B6470"/>
    <text x="872" y="257" fill="#F0EDF2">#6B6470</text>

    <rect x="1056" y="228" width="180" height="46" rx="10" fill="#E8578A"/>
    <text x="1072" y="257" fill="#F0EDF2" font-weight="600">#E8578A</text>
  </g>

  <g opacity="0">
    <rect x="56" y="228" width="1180" height="46" rx="10" fill="url(#sheen)"/>
    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.08;1" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/>
  </g>

  <path class="rule" d="M 56 294 L 1236 294" stroke-width="1"/>

  <!-- ══ 对比度约束：颜色表里最容易忽略的一条 ══ -->
  <text class="tm" x="56" y="326"
        font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="14">品牌色做文字不达 WCAG AA，因此派生「文字安全版」（原色保留做背景 / 图标）：</text>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
    <rect x="56" y="340" width="92" height="30" rx="8" fill="#9499A0"/>
    <text x="68" y="360" fill="#1A171C">#9499A0</text>
    <text class="tk" x="156" y="360">2.9:1 ✗</text>
    <text class="tk" x="226" y="360">→</text>
    <rect x="252" y="340" width="92" height="30" rx="8" fill="#6B6470"/>
    <text x="264" y="360" fill="#F0EDF2">#6B6470</text>
    <text class="tm" x="352" y="360">5.8:1 ✓</text>

    <rect x="440" y="340" width="92" height="30" rx="8" fill="#FB7299"/>
    <text x="452" y="360" fill="#1A171C">#FB7299</text>
    <text class="tk" x="540" y="360">2.6:1 ✗</text>
    <text class="tk" x="610" y="360">→</text>
    <rect x="636" y="340" width="92" height="30" rx="8" fill="#C2416B"/>
    <text x="648" y="360" fill="#F0EDF2">#C2416B</text>
    <text class="tm" x="736" y="360">5.1:1 ✓</text>

    <rect x="824" y="340" width="92" height="30" rx="8" fill="#00A1D6"/>
    <text x="836" y="360" fill="#1A171C">#00A1D6</text>
    <text class="tk" x="924" y="360">3.0:1 ✗</text>
    <text class="tk" x="994" y="360">→</text>
    <rect x="1020" y="340" width="92" height="30" rx="8" fill="#0077A8"/>
    <text x="1032" y="360" fill="#F0EDF2">#0077A8</text>
    <text class="tm" x="1120" y="360">5.0:1 ✓</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="399" fill="none" stroke="#888888" stroke-opacity="0.14"/>
</svg>
