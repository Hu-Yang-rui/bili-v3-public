<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" width="1280" height="450" role="img"
     aria-label="BiliV3 — 第三方 B 站 Android 客户端。左侧为字标与技术栈，右侧为首页与播放器的界面示意，含弹幕与骨架微光动效。">
  <title>BiliV3 — 第三方 B 站 Android 客户端</title>

  <defs>
    <!-- 氛围光：品牌粉，低透明度，不抢内容 -->
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="180" cy="-60" r="760">
      <stop offset="0" stop-color="#FF8FB0" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FF8FB0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FF8FB0" stop-opacity="0"/>
    </radialGradient>

    <!-- 字标：品牌粉 → 主文字 → 品牌粉，横向扫过 -->
    <linearGradient id="word" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="300" y2="0">
      <stop offset="0" stop-color="#FF8FB0"/>
      <stop offset="0.5" stop-color="#F0EDF2"/>
      <stop offset="1" stop-color="#FF8FB0"/>
      <animate attributeName="x1" values="20;900;20" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="300;1180;300" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- 分隔线扫光：骨架微光相位（1200ms 量级） -->
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="236" y2="0">
      <stop offset="0" stop-color="#FF8FB0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF8FB0" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#FF8FB0" stop-opacity="0"/>
      <animate attributeName="x1" values="56;1224" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="236;1404" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- 封面骨架微光：一条梯度横跨三张卡，即「共享相位」 -->
    <linearGradient id="coverShim" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="740" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="x1" values="640;1260" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="740;1360" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- 播放器画面示意（抽象，不用真实截图） -->
    <linearGradient id="scene" gradientUnits="userSpaceOnUse" x1="660" y1="36" x2="1240" y2="232">
      <stop offset="0" stop-color="#2A272E"/>
      <stop offset="0.55" stop-color="#1C1A1F"/>
      <stop offset="1" stop-color="#3A2A33"/>
    </linearGradient>

    <clipPath id="playerClip">
      <rect x="660" y="36" width="580" height="196" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1280" height="450" fill="#121114"/>
  <ellipse cx="180" cy="-60" rx="760" ry="520" fill="url(#glow)">
    <animate attributeName="opacity" values="1;0.6;1" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ══════════ 左栏：字标 + 技术栈 ══════════ -->
  <text x="56" y="152" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="74" font-weight="700" letter-spacing="0.5" fill="url(#word)">BiliV3</text>

  <text x="60" y="194" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="19" fill="#A8A2B0">第三方 B 站 Android 客户端</text>

  <rect x="56" y="218" width="528" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="56" y="218" width="528" height="2" rx="1" fill="url(#shimmer)"/>

  <!-- 技术栈胶囊（两行） -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15">
    <rect x="56" y="246" width="134" height="32" rx="16" fill="#26232B" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="72" y="267" fill="#F0EDF2">Kotlin 2.0.21</text>

    <rect x="200" y="246" width="128" height="32" rx="16" fill="#26232B" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="216" y="267" fill="#F0EDF2">Compose M3</text>

    <rect x="338" y="246" width="122" height="32" rx="16" fill="#26232B" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="354" y="267" fill="#F0EDF2">Media3 1.4.1</text>

    <rect x="56" y="290" width="110" height="32" rx="16" fill="#26232B" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="72" y="311" fill="#A8A2B0">minSdk 26</text>

    <rect x="176" y="290" width="118" height="32" rx="16" fill="#26232B" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="192" y="311" fill="#A8A2B0">targetSdk 35</text>

    <rect x="304" y="290" width="132" height="32" rx="16" fill="#FF8FB0" fill-opacity="0.14"
          stroke="#FF8FB0" stroke-opacity="0.45"/>
    <text x="320" y="311" fill="#FF8FB0">Noncommercial</text>
  </g>

  <text x="56" y="392" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="15" fill="#7A7484">暖调深色底 · 卡片分层 · B 站品牌粉 · 官方级精度</text>

  <!-- ══════════ 右栏：播放器示意 + 首页卡片栅格 ══════════ -->
  <g clip-path="url(#playerClip)">
    <rect x="660" y="36" width="580" height="196" fill="#000000"/>
    <rect x="660" y="36" width="580" height="196" fill="url(#scene)"/>
    <ellipse cx="1120" cy="70" rx="220" ry="130" fill="#FF8FB0" fill-opacity="0.10"/>

    <!-- 弹幕：自绘渲染层示意，缓动同页面转场 -->
    <!-- ⚠️ 两个约束，改之前先看：
         ① base x 必须落在播放器可视区（660..1240）内。若 SMIL 不执行
            （Safari 的 <img>、camo 代理、打印/PDF），弹幕会永久停在这一帧；
            base x=0 会让四条弹幕全部落到裁剪区外 → 播放器变成空壳。
         ② 动画终点必须让文字**完全移出左边界**（x+tx+字宽 < 660）。
            只有两个 keyframe 时终点会瞬间跳回起点，若此刻文字还在画面里，
            就会看到弹幕在中途"啪"地闪回。四条终点都停在 x=140，已出画。
    -->
    <g font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif"
       font-size="17" fill="#FFFFFF" stroke="#000000" stroke-width="3.5"
       stroke-linejoin="round" paint-order="stroke">
      <text x="700" y="76">这也太丝滑了
        <animateTransform attributeName="transform" type="translate"
          values="580 0;-560 0" dur="9s" begin="-1s" repeatCount="indefinite"/>
      </text>
      <text x="880" y="108">封面 16:10
        <animateTransform attributeName="transform" type="translate"
          values="400 0;-740 0" dur="12s" begin="-7s" repeatCount="indefinite"/>
      </text>
      <text x="760" y="140" fill="#FF8FB0">骨架共享相位
        <animateTransform attributeName="transform" type="translate"
          values="520 0;-620 0" dur="10.5s" begin="-4s" repeatCount="indefinite"/>
      </text>
      <text x="940" y="172">DASH 音视频分离
        <animateTransform attributeName="transform" type="translate"
          values="340 0;-800 0" dur="13.5s" begin="-10s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- 清晰度角标 -->
    <rect x="1164" y="184" width="60" height="24" rx="6" fill="#000000" fill-opacity="0.55"/>
    <text x="1176" y="201" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#F0EDF2">1080P</text>

    <!-- 进度条：本地 PlaybackProgressStore + 服务端 history/report -->
    <rect x="676" y="216" width="548" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.22"/>
    <rect x="676" y="216" width="150" height="3" rx="1.5" fill="#FF8FB0">
      <animate attributeName="width" values="150;430;150" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 首页卡片栅格：3 列 × 封面 16:10 -->
  <!-- ⚠️ 时长角标的右边缘必须留 8px 内边距（= 卡片右边界 - 8 - 46），
       角标宽度 46 而非 40：40 装不下 5 字符的 "24:51"（11px 字号约 30.5px，
       减去左右各 6px 内边距只剩 28px 可用）。首版角标右边缘溢出封面 12px。 -->
  <g>
    <rect x="660" y="252" width="180" height="112" rx="12" fill="#2A272E"/>
    <rect x="660" y="252" width="180" height="112" rx="12" fill="url(#coverShim)"/>
    <rect x="786" y="340" width="46" height="16" rx="2" fill="#000000" fill-opacity="0.65"/>
    <text x="794" y="352" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#F0EDF2">12:34</text>
    <rect x="660" y="376" width="152" height="9" rx="4.5" fill="#F0EDF2" fill-opacity="0.88"/>
    <rect x="660" y="392" width="104" height="9" rx="4.5" fill="#F0EDF2" fill-opacity="0.88"/>
    <rect x="660" y="412" width="88" height="8" rx="4" fill="#7A7484"/>

    <rect x="860" y="252" width="180" height="112" rx="12" fill="#2A272E"/>
    <rect x="860" y="252" width="180" height="112" rx="12" fill="url(#coverShim)"/>
    <rect x="986" y="340" width="46" height="16" rx="2" fill="#000000" fill-opacity="0.65"/>
    <text x="994" y="352" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#F0EDF2">08:07</text>
    <rect x="860" y="376" width="140" height="9" rx="4.5" fill="#F0EDF2" fill-opacity="0.88"/>
    <rect x="860" y="392" width="118" height="9" rx="4.5" fill="#F0EDF2" fill-opacity="0.88"/>
    <rect x="860" y="412" width="96" height="8" rx="4" fill="#7A7484"/>

    <rect x="1060" y="252" width="180" height="112" rx="12" fill="#2A272E"/>
    <rect x="1060" y="252" width="180" height="112" rx="12" fill="url(#coverShim)"/>
    <rect x="1186" y="340" width="46" height="16" rx="2" fill="#000000" fill-opacity="0.65"/>
    <text x="1194" y="352" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#F0EDF2">24:51</text>
    <rect x="1060" y="376" width="148" height="9" rx="4.5" fill="#F0EDF2" fill-opacity="0.88"/>
    <rect x="1060" y="392" width="92" height="9" rx="4.5" fill="#F0EDF2" fill-opacity="0.88"/>
    <rect x="1060" y="412" width="104" height="8" rx="4" fill="#7A7484"/>
  </g>

  <!-- 外框：深色下的分层手段（描边 10% 白，投影在黑底上不可见） -->
  <rect x="0.5" y="0.5" width="1279" height="449" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
</svg>
