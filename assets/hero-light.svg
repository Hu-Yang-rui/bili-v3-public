<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" width="1280" height="450" role="img"
     aria-label="BiliV3 — 第三方 B 站 Android 客户端。左侧为字标与技术栈，右侧为首页与播放器的界面示意，含弹幕与骨架微光动效。">
  <title>BiliV3 — 第三方 B 站 Android 客户端</title>

  <defs>
    <!-- 浅色下氛围光要压得更低：浅底上一点点粉就很脏 -->
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="180" cy="-60" r="760">
      <stop offset="0" stop-color="#E8578A" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#E8578A" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#E8578A" stop-opacity="0"/>
    </radialGradient>

    <!-- 字标：浅色下品牌粉要压深（#E8578A），否则白底上不达 AA -->
    <linearGradient id="word" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="300" y2="0">
      <stop offset="0" stop-color="#E8578A"/>
      <stop offset="0.5" stop-color="#1A171C"/>
      <stop offset="1" stop-color="#E8578A"/>
      <animate attributeName="x1" values="20;900;20" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="300;1180;300" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="236" y2="0">
      <stop offset="0" stop-color="#E8578A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8578A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E8578A" stop-opacity="0"/>
      <animate attributeName="x1" values="56;1224" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="236;1404" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- 骨架微光：浅底上走黑而非白 -->
    <linearGradient id="coverShim" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="740" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="x1" values="640;1260" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="740;1360" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="scene" gradientUnits="userSpaceOnUse" x1="660" y1="36" x2="1240" y2="232">
      <stop offset="0" stop-color="#2A272E"/>
      <stop offset="0.55" stop-color="#1C1A1F"/>
      <stop offset="1" stop-color="#3A2A33"/>
    </linearGradient>

    <clipPath id="playerClip">
      <rect x="660" y="36" width="580" height="196" rx="16"/>
    </clipPath>
  </defs>

  <!-- 页面底 #F7F4F6（暖调，刻意不用纯白） -->
  <rect width="1280" height="450" fill="#F7F4F6"/>
  <ellipse cx="180" cy="-60" rx="760" ry="520" fill="url(#glow)">
    <animate attributeName="opacity" values="1;0.6;1" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ══════════ 左栏 ══════════ -->
  <text x="56" y="152" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="74" font-weight="700" letter-spacing="0.5" fill="url(#word)">BiliV3</text>

  <text x="60" y="194" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="19" fill="#6B6470">第三方 B 站 Android 客户端</text>

  <rect x="56" y="218" width="528" height="2" rx="1" fill="#000000" fill-opacity="0.08"/>
  <rect x="56" y="218" width="528" height="2" rx="1" fill="url(#shimmer)"/>

  <!-- 技术栈胶囊：浅色用悬浮底 #F2EDF0 + 5% 黑描边 -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15">
    <rect x="56" y="246" width="134" height="32" rx="16" fill="#F2EDF0" stroke="#000000" stroke-opacity="0.05"/>
    <text x="72" y="267" fill="#1A171C">Kotlin 2.0.21</text>

    <rect x="200" y="246" width="128" height="32" rx="16" fill="#F2EDF0" stroke="#000000" stroke-opacity="0.05"/>
    <text x="216" y="267" fill="#1A171C">Compose M3</text>

    <rect x="338" y="246" width="122" height="32" rx="16" fill="#F2EDF0" stroke="#000000" stroke-opacity="0.05"/>
    <text x="354" y="267" fill="#1A171C">Media3 1.4.1</text>

    <rect x="56" y="290" width="110" height="32" rx="16" fill="#F2EDF0" stroke="#000000" stroke-opacity="0.05"/>
    <text x="72" y="311" fill="#6B6470">minSdk 26</text>

    <rect x="176" y="290" width="118" height="32" rx="16" fill="#F2EDF0" stroke="#000000" stroke-opacity="0.05"/>
    <text x="192" y="311" fill="#6B6470">targetSdk 35</text>

    <rect x="304" y="290" width="132" height="32" rx="16" fill="#E8578A" fill-opacity="0.10"
          stroke="#E8578A" stroke-opacity="0.40"/>
    <text x="320" y="311" fill="#C2416B">Noncommercial</text>
  </g>

  <text x="56" y="392" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="15" fill="#A79FAD">暖调深色底 · 卡片分层 · B 站品牌粉 · 官方级精度</text>

  <!-- ══════════ 右栏：播放器（两主题同值纯黑，全站唯一允许处） ══════════ -->
  <g clip-path="url(#playerClip)">
    <rect x="660" y="36" width="580" height="196" fill="#000000"/>
    <rect x="660" y="36" width="580" height="196" fill="url(#scene)"/>
    <ellipse cx="1120" cy="70" rx="220" ry="130" fill="#FF8FB0" fill-opacity="0.10"/>

    <g font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif"
       font-size="17" fill="#FFFFFF" stroke="#000000" stroke-width="3.5"
       stroke-linejoin="round" paint-order="stroke">
      <text x="0" y="76">这也太丝滑了
        <animateTransform attributeName="transform" type="translate"
          values="1250 0;620 0" dur="9s" begin="-1s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="108">封面 16:10
        <animateTransform attributeName="transform" type="translate"
          values="1250 0;620 0" dur="12s" begin="-7s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="140" fill="#FF8FB0">骨架共享相位
        <animateTransform attributeName="transform" type="translate"
          values="1250 0;620 0" dur="10.5s" begin="-4s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="172">DASH 音视频分离
        <animateTransform attributeName="transform" type="translate"
          values="1250 0;620 0" dur="13.5s" begin="-10s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="1164" y="184" width="60" height="24" rx="6" fill="#000000" fill-opacity="0.55"/>
    <text x="1176" y="201" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#F0EDF2">1080P</text>

    <rect x="676" y="216" width="548" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.22"/>
    <rect x="676" y="216" width="150" height="3" rx="1.5" fill="#FF8FB0">
      <animate attributeName="width" values="150;430;150" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 首页卡片栅格：浅色用白卡 + shadow（深色下投影不可见，此处可见） -->
  <g>
    <rect x="660" y="252" width="180" height="112" rx="12" fill="#E5DFE4"/>
    <rect x="660" y="252" width="180" height="112" rx="12" fill="url(#coverShim)"/>
    <rect x="812" y="340" width="40" height="16" rx="2" fill="#000000" fill-opacity="0.65"/>
    <text x="818" y="352" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#F0EDF2">12:34</text>
    <rect x="660" y="376" width="152" height="9" rx="4.5" fill="#1A171C" fill-opacity="0.86"/>
    <rect x="660" y="392" width="104" height="9" rx="4.5" fill="#1A171C" fill-opacity="0.86"/>
    <rect x="660" y="412" width="88" height="8" rx="4" fill="#A79FAD"/>

    <rect x="860" y="252" width="180" height="112" rx="12" fill="#E5DFE4"/>
    <rect x="860" y="252" width="180" height="112" rx="12" fill="url(#coverShim)"/>
    <rect x="1012" y="340" width="40" height="16" rx="2" fill="#000000" fill-opacity="0.65"/>
    <text x="1018" y="352" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#F0EDF2">08:07</text>
    <rect x="860" y="376" width="140" height="9" rx="4.5" fill="#1A171C" fill-opacity="0.86"/>
    <rect x="860" y="392" width="118" height="9" rx="4.5" fill="#1A171C" fill-opacity="0.86"/>
    <rect x="860" y="412" width="96" height="8" rx="4" fill="#A79FAD"/>

    <rect x="1060" y="252" width="180" height="112" rx="12" fill="#E5DFE4"/>
    <rect x="1060" y="252" width="180" height="112" rx="12" fill="url(#coverShim)"/>
    <rect x="1212" y="340" width="40" height="16" rx="2" fill="#000000" fill-opacity="0.65"/>
    <text x="1218" y="352" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#F0EDF2">24:51</text>
    <rect x="1060" y="376" width="148" height="9" rx="4.5" fill="#1A171C" fill-opacity="0.86"/>
    <rect x="1060" y="392" width="92" height="9" rx="4.5" fill="#1A171C" fill-opacity="0.86"/>
    <rect x="1060" y="412" width="104" height="8" rx="4" fill="#A79FAD"/>
  </g>

  <!-- 外框：浅色下 5% 黑 -->
  <rect x="0.5" y="0.5" width="1279" height="449" fill="none" stroke="#000000" stroke-opacity="0.05"/>
</svg>
