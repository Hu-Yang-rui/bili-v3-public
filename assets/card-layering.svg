<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img"
     aria-label="BiliV3 深浅色分层手段：浅色用 shadow 投影，深色用 1dp 10% 白描边，两者封装为 Modifier.biliCard()。">
  <title>BiliV3 深浅色分层手段</title>

  <style>
    .bg    { fill:#121114; }
    .tt    { fill:#F0EDF2; }
    .tm    { fill:#A8A2B0; }
    .tk    { fill:#7A7484; }
    .div   { stroke:#FFFFFF; stroke-opacity:.10; }
    @media (prefers-color-scheme: light) {
      .bg   { fill:#F7F4F6; }
      .tt   { fill:#1A171C; }
      .tm   { fill:#6B6470; }
      .tk   { fill:#A79FAD; }
      .div  { stroke:#000000; stroke-opacity:.10; }
    }
  </style>

  <rect class="bg" width="1280" height="340"/>

  <!-- 中缝分隔 -->
  <path class="div" d="M 640 40 L 640 300" stroke-width="1"/>

  <!-- ══════════ 左：深色手段 = 1dp 描边 ══════════ -->
  <text class="tt" x="80" y="76"
        font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="18" font-weight="600">深色 · border(1dp, 10% 白)</text>

  <g>
    <!-- 卡片本体：深色底 #1C1A1F -->
    <rect x="80" y="106" width="440" height="150" rx="16" fill="#1C1A1F"/>

    <!-- 描边：沿卡片轮廓走一圈的追光。
         用 stroke-dasharray 只亮一段，再用 stroke-dashoffset 把它绕一圈，
         视觉上就是「描边在呼吸」。 -->
    <rect x="80.5" y="106.5" width="439" height="149" rx="16" fill="none"
          stroke="#FF8FB0" stroke-width="1.5" stroke-opacity="0.9"
          stroke-dasharray="150 1306" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="1456;0" dur="5s"
        repeatCount="indefinite"/>
    </rect>

    <!-- 静态基底描边：保证 SMIL 不执行时轮廓依然清晰 -->
    <rect x="80.5" y="106.5" width="439" height="149" rx="16" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
  </g>

  <text class="tm" x="80" y="286"
        font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif" font-size="14">
    黑底黑影 —— 投影渲染出来几乎为零，所以深色下靠描边分层
  </text>

  <!-- ══════════ 右：浅色手段 = shadow 投影 ══════════ -->
  <text class="tt" x="720" y="76"
        font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="18" font-weight="600">浅色 · shadow(3dp)</text>

  <g>
    <!-- 投影：多层偏移叠加模拟模糊。
         偏移量与透明度同步呼吸，模拟卡片「浮起来」的层次变化。 -->
    <g>
      <rect x="720" y="106" width="440" height="150" rx="16" fill="#000000" fill-opacity="0.05"/>
      <rect x="720" y="108" width="440" height="150" rx="16" fill="#000000" fill-opacity="0.05"/>
      <rect x="720" y="110" width="440" height="150" rx="16" fill="#000000" fill-opacity="0.04"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 -3;0 3;0 -3" dur="4.5s" repeatCount="indefinite"/>
    </g>

    <!-- 白卡浮在浅灰底上 -->
    <rect x="720" y="106" width="440" height="150" rx="16" fill="#FFFFFF"/>
  </g>

  <text class="tm" x="720" y="286"
        font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif" font-size="14">
    白卡浮在浅灰底上 —— 投影清晰可见，所以浅色下靠投影分层
  </text>

  <!-- 结论 -->
  <text class="tk" x="80" y="322"
        font-family="'Microsoft YaHei','PingFang SC','Segoe UI',Helvetica,Arial,sans-serif" font-size="14">
    已封装为 Modifier.biliCard()：页面里不要再自己拼 shadow + background + clip
  </text>

  <rect x="0.5" y="0.5" width="1279" height="339" fill="none" stroke="#888888" stroke-opacity="0.14"/>
</svg>
