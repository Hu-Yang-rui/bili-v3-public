name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 只读权限即可：CI 不签名、不发版、不写仓库
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Assemble Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # ⚠️ 必须用 v4：v3 会无条件执行 `sdkmanager tools`，
        # 而 `tools` 包早已从 SDK 仓库下线 → "Failed to find package 'tools'" → exit 1。
        # 这跟项目代码无关，纯粹是 action 版本过期。
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        # 显式装 compileSdk / build-tools，不依赖 AGP 自动下载
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Assemble debug APK
        # release 变体需要签名密钥，CI 上没有，故只构建 debug
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Report build environment
        if: always()
        run: java -version 2>&1 && ./gradlew --version

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
